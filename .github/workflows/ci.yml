name: FedShield CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    
    - name: Run backend tests
      run: python -m pytest -q
    
    - name: Compile Python source
      run: python -m compileall -q .
    
    - name: Validate active model and runtime
      run: |
        python -c "
        import json
        import torch
        from fedshield_runtime import runtime
        from model import MultiClassIDS, MULTICLASS_CLASS_NAMES
        model = MultiClassIDS()
        assert model.input_dim == 41
        assert model.num_classes == 5
        assert MULTICLASS_CLASS_NAMES == ['Normal', 'DoS', 'Probe', 'R2L', 'U2R']
        x = torch.randn(10, 41)
        out = model(x)
        assert out.shape == (10, 5), 'Model output shape wrong'
        assert runtime.model is not None, 'Active model artifact did not load'
        assert runtime.scaler is not None, 'Active scaler artifact did not load'
        assert runtime.encoders is not None, 'Active encoder artifact did not load'
        with open('models/artifact_manifest.json', encoding='utf-8') as file:
            manifest = json.load(file)
        for artifact in [
            'models/federated_noniid_model.pth',
            'models/scaler_multiclass.pkl',
            'models/encoders_multiclass.pkl',
            'models/artifact_manifest.json',
            'models/model_version.json',
        ]:
            assert __import__('os').path.exists(artifact), artifact
        print('Active model/runtime contract passed!')
        "
    
    - name: Install frontend dependencies
      working-directory: web
      run: npm ci

    - name: Build frontend
      working-directory: web
      run: npm run build

    - name: Check tracked repository hygiene
      run: |
        matches=$(git ls-files | grep -E '(^|/)(\.env|node_modules|__pycache__)(/|$)|\.pyc$|(^|/)models/.*\.db$|(^|/)(live_log|drift_log)\.json$' || true)
        if [ -n "$matches" ]; then
          echo "Generated or secret files are tracked:"
          echo "$matches"
          exit 1
        fi

    - name: Build Docker image
      run: docker build -t fedshield-test .