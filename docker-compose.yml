services:
  # One-shot federated training job: runs 10 rounds, saves the model, exits.
  # NOT a persistent service - restart policy is "no" on purpose. This is a
  # training run, not a server that should loop forever.
  server:
    build: .
    container_name: fedshield_server
    command: python server/flower_server.py
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8080),2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  node1:
    build: .
    container_name: fedshield_node1
    command: python nodes/flower_client.py 1
    environment:
      - SERVER_ADDRESS=server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  node2:
    build: .
    container_name: fedshield_node2
    command: python nodes/flower_client.py 2
    environment:
      - SERVER_ADDRESS=server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  node3:
    build: .
    container_name: fedshield_node3
    command: python nodes/flower_client.py 3
    environment:
      - SERVER_ADDRESS=server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  # Persistent services below - these are what should actually stay running.
  api:
    build: .
    container_name: fedshield_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    container_name: fedshield_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped