services:
  # ─────────────────────────────────────────────────────────────
  # Federated Learning Server
  # One-shot job: runs the configured training rounds and exits.
  # ─────────────────────────────────────────────────────────────
  server:
    build: .
    container_name: fedshield_server
    command: python -m server.flower_server
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost',8080),2); s.close()"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # Federated Learning Client 1
  # ─────────────────────────────────────────────────────────────
  node1:
    build: .
    container_name: fedshield_node1
    command: python -m nodes.flower_client 1
    environment:
      SERVER_ADDRESS: server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  # Federated Learning Client 2
  # ─────────────────────────────────────────────────────────────
  node2:
    build: .
    container_name: fedshield_node2
    command: python -m nodes.flower_client 2
    environment:
      SERVER_ADDRESS: server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  # Federated Learning Client 3
  # ─────────────────────────────────────────────────────────────
  node3:
    build: .
    container_name: fedshield_node3
    command: python -m nodes.flower_client 3
    environment:
      SERVER_ADDRESS: server:8080
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: fedshield_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # React/Vite Frontend
  #
  # The existing React dashboard is the only active frontend.
  # Nginx serves the compiled React application and proxies
  # /api and /auth requests to FastAPI.
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fedshield_web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
